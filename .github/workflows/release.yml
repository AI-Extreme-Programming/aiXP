name: Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      book_tag:
        description: Rebuild the EPUB and print PDF for this existing release tag (e.g. v0.0.2) and skip release-please
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    if: ${{ !inputs.book_tag }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  apply-staged-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    outputs:
      used_staging: ${{ steps.apply.outputs.used_staging }}
      discord_blurb: ${{ steps.apply.outputs.discord_blurb }}
    steps:
      - name: Apply staged notes and clean up
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          STAGING_BRANCH="pre-release-staging/$TAG"

          if ! gh api "repos/$REPO/branches/$STAGING_BRANCH" > /dev/null 2>&1; then
            echo "used_staging=false" >> "$GITHUB_OUTPUT"
            echo "No staging branch found for $TAG — will fall back to AI generation"
            exit 0
          fi

          echo "Found staging branch: $STAGING_BRANCH"

          NOTES=$(gh api "repos/$REPO/contents/.github/tmp/pre-release-staging/release-notes.md?ref=$STAGING_BRANCH" \
            --jq '.content' | base64 -d)
          BLURB=$(gh api "repos/$REPO/contents/.github/tmp/pre-release-staging/discord-blurb.txt?ref=$STAGING_BRANCH" \
            --jq '.content' | base64 -d 2>/dev/null || echo "")

          printf '%s' "$NOTES" > /tmp/staged-release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/staged-release-notes.md
          echo "Applied staged release notes to $TAG"

          gh api "repos/$REPO/git/refs/heads/$STAGING_BRANCH" --method DELETE || true
          echo "Deleted staging branch: $STAGING_BRANCH"

          echo "used_staging=true" >> "$GITHUB_OUTPUT"
          { echo 'discord_blurb<<BLURB_EOF'
            printf '%s\n' "$BLURB"
            echo 'BLURB_EOF'
          } >> "$GITHUB_OUTPUT"

  improve-release-notes:
    needs: [release-please, apply-staged-notes]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.apply-staged-notes.outputs.used_staging == 'false'
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: ${{ github.event.repository.name }}
      # TODO: Replace with a one-sentence description of what this project does
      project_context: "${{ github.event.repository.name }} is a project by ${{ github.repository_owner }}."
      header: |
        ## ${{ github.event.repository.name }}

        > TODO: Replace with your project tagline.

        ---
      footer: |
        ---
        📖 [User Guide](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/${{ github.repository }}/issues/new?template=feature_request.md)
    secrets: inherit

  update-changelog-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-update-changelog-prs.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  discord-notify:
    needs: [release-please, apply-staged-notes, improve-release-notes]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      !failure() && !cancelled()
    uses: ScottKirvan/.github/.github/workflows/reusable-discord-notify.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: ${{ github.event.repository.name }}
      emoji: "🚀"  # TODO: Replace with your project's emoji
      discord_blurb: ${{ needs.apply-staged-notes.outputs.discord_blurb || needs.improve-release-notes.outputs.discord_blurb }}
    secrets: inherit

  # Interim (design doc section 9): GitHub-hosted build, assets attached to the public release.
  # Not a dependency of any other job, so a failed book build leaves the release notes intact.
  build-book:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || inputs.book_tag)
    permissions:
      contents: write
    uses: ./.github/workflows/book-build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name || inputs.book_tag }}
      version: ${{ needs.release-please.outputs.tag_name || inputs.book_tag }}
      release_tag: ${{ needs.release-please.outputs.tag_name || inputs.book_tag }}
