name: Book dev print (temporary)

on:
  push:
    branches:
      - feat/book-print-pdf

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Install print toolchain
        run: bash book/scripts/ci/install-print-tools.sh

      - name: Install book tooling
        working-directory: book
        run: npm ci

      - name: Preprocessor unit tests
        working-directory: book
        run: npm test

      - name: Print unit tests
        env:
          AIXP_REQUIRE_PRINT_TOOLS: '1'
        run: python3 -m unittest discover -s book/test/print -v

      - name: Print build and preflight
        run: bash book/scripts/build-print.sh

      - name: Diagnose exponent-form numbers (temporary)
        if: always()
        run: |
          python3 - dist/print/latex/interior.pdf <<'PY'
          import sys, re, pikepdf
          pat = re.compile(r'(?<![\w/#.])[-+]?(?:\d+\.?\d*|\.\d+)[eE][-+]?\d+(?![\w.])')
          pdf = pikepdf.open(sys.argv[1])
          hits = 0
          for o in pdf.objects:
              if isinstance(o, pikepdf.Stream):
                  if o.get('/Subtype') in (pikepdf.Name.Image,) or any(k in o for k in ('/Length1', '/Length2', '/Length3')) or o.get('/Subtype') in (pikepdf.Name('/CIDFontType0C'), pikepdf.Name('/Type1C'), pikepdf.Name('/OpenType')):
                      continue
                  try:
                      body = o.read_bytes()
                  except Exception:
                      continue
                  body = re.sub(rb'<[0-9A-Fa-f\s]*>', b'', body)
                  body = re.sub(rb'\((?:\.|[^\)])*\)', b'', body)
                  found = [m.group(0) for m in pat.finditer(body.decode('latin-1'))]
                  kind = str(o.get('/Subtype') or o.get('/Type') or 'stream')
              elif isinstance(o, (pikepdf.Dictionary, pikepdf.Array)):
                  found = [m.group(0) for m in pat.finditer(repr(o))]
                  kind = 'dict'
              else:
                  continue
              if found:
                  hits += 1
                  print(o.objgen, kind, found[:6])
          print('objects with exponent numbers:', hits)
          PY
