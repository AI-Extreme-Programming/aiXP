name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: ${{ github.event.repository.name }}
      project_context: "aiXP is a working draft of a proposed software engineering discipline, Extreme Programming for human-AI teams of 1 to N, grounded in classic XP, Lean and SRE and published as a book-style site. Releases add or revise chapters and sections. Write for readers following the draft (engineers and team leads): say what's new to read or how the argument changed, not repository mechanics. Keep the project's plain voice, with no hype words."
      header: |
        ## ${{ github.event.repository.name }}

        > Extreme Programming for Human-AI Teams of 1 to N. Working draft.

        ---
      footer: |
        ---
        📖 [Read the draft](https://www.scottkirvan.com/aiXP/) ·💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/${{ github.repository }}/issues/new?template=feature_request.md)
    secrets: inherit
