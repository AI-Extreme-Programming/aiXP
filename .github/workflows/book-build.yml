name: Book Build

# Interim (design doc section 9): builds on GitHub-hosted Ubuntu and, when
# release_tag is set, attaches the EPUB and print PDF to that GitHub Release.
# Run it by hand (Actions > Book Build > Run workflow) to build any branch and
# download the EPUB and print PDF as an Actions artifact. PR and release builds
# upload no artifact. Callers grant the token permissions: contents: read for
# checks, contents: write when uploading to a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Book version vX.Y.Z printed in the colophon (blank uses notes/VERSION.md)
        type: string
        default: ''
      artifact:
        description: Upload the EPUB and print PDF as a downloadable artifact
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        default: ''
      version:
        description: Book version vX.Y.Z (defaults to notes/VERSION.md)
        type: string
        default: ''
      release_tag:
        description: Release to attach the EPUB and print PDF to; empty builds without uploading
        type: string
        default: ''
      artifact:
        description: Upload the EPUB and print PDF as a downloadable Actions artifact
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIXP_EPUB_SMOKE: '1'
      AIXP_REQUIRE_PRINT_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Install book tooling
        working-directory: book
        run: npm ci

      # Normally about a minute each; the limit stops a stalled package download from
      # holding the job until its 30-minute timeout.
      - name: Install EPUB toolchain
        timeout-minutes: 15
        run: bash book/scripts/ci/install-epub-tools.sh

      - name: Install print toolchain
        timeout-minutes: 15
        run: bash book/scripts/ci/install-print-tools.sh

      - name: Shell script lint
        run: shellcheck book/scripts/ci/*.sh book/scripts/build-print.sh

      - name: Node tests (preprocessor and EPUB)
        working-directory: book
        run: npm test

      - name: Python tests (print and PDF/X checker)
        run: python3 -m unittest discover -s book/test/print

      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="v$(sed -n 's/^version=//p' notes/VERSION.md)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Book version: $VERSION"

      - name: Build EPUB
        run: node book/scripts/build-epub.js --version "${{ steps.version.outputs.version }}"

      - name: Build print interior
        run: bash book/scripts/build-print.sh --version "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        if: inputs.artifact
        uses: actions/upload-artifact@v4
        with:
          name: aixp-book-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit }}
          path: |
            dist/aixp-${{ steps.version.outputs.version }}.epub
            dist/aixp-${{ steps.version.outputs.version }}-print-6x9.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/aixp-$VERSION.epub" \
            "dist/aixp-$VERSION-print-6x9.pdf"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
